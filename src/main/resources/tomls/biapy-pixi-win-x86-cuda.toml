[workspace]
name = "%s"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["win-64"]

# Global environment isolation
# Applies to `pixi shell` activation + all `pixi run` tasks.
[activation.env]
CUDA_HOME = ""
CUDA_PATH = ""
CUDA_ROOT = ""
LD_LIBRARY_PATH = ""
DYLD_LIBRARY_PATH = ""
PYTHONPATH = ""
PATH = "%%CONDA_PREFIX%%\\Lib\\site-packages\\torch\\lib;%%PATH%%"

[dependencies]
python = "==3.10"
pip = "*"

[pypi-dependencies]
# Pin backend APIs; update these revisions together in all biapy manifests.
jdll-unet = { git = "https://github.com/carlosuc3m/jdll-unet.git", rev = "d19046c269a1cb43baba5f8f5d8215b8c7f05e5b", extras = ["region-reading"] }
jdll-denoise = { git = "https://github.com/carlosuc3m/jdll-denoise.git", rev = "e502bbfd4865f08d1a0b6cba41aab1865f596d61", extras = ["bm"] }
timm = "==1.0.14"
pytorch-msssim = "==1.0.0"
torchmetrics = "==1.4.3"
cellpose = "==3.1.1.1"
scipy = "==1.15.2"
torch-fidelity = "==0.3.0"
careamics = "*"
biapy = "==3.5.10"
ultralytics = "==8.4.40"
appose = "*"

# Windows CUDA (same Java version family, but CUDA wheel index for the CUDA env)
torch = { version = "==2.4.1", index = "https://download.pytorch.org/whl/cu%s" }
torchvision = { version = "==0.19.1", index = "https://download.pytorch.org/whl/cu%s" }

[tasks.python]
cmd = "python"

[tasks.check-gpu]
cmd = '''
python -c "import platform, torch, torchvision; print('Torch:', torch.__version__); print('Torchvision:', torchvision.__version__); print('CUDA available:', torch.cuda.is_available()); print('CUDA runtime:', torch.version.cuda); print('Platform:', platform.platform())"
'''
